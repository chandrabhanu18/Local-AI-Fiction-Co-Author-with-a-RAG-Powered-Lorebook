services:
  # ----------------------------------------------------
  # 1. Ollama LLM Service
  # ----------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: fiction_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------
  # 2. ChromaDB Vector Database Service
  # ----------------------------------------------------
  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: fiction_chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------
  # 3. Main Application Service (FastAPI + RAG)
  # ----------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiction_coauthor_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION_NAME=fiction_lorebook
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - DEFAULT_TOP_K=3
      - PERSONA_PROMPT_PATH=prompts/persona.md
    depends_on:
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ollama_data:
  chroma_data:
